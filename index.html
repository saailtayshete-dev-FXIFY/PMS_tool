function newQuestion(type = 'rating') {
  const q = { id: uid('q'), type, label: '', help: '', required: true };
  if (type === 'rating') { q.low = 'Needs improvement'; q.high = 'Outstanding'; }
  if (type === 'choice' || type === 'checkbox') q.options = ['Option 1', 'Option 2'];
  return q;
}
function builderFor(id) {
  if (UI.builder && UI.builder.key === id) return UI.builder;
  const src = id === 'new' ? { name: 'Untitled questionnaire', description: '', audience: 'peer', questions: [newQuestion('rating')] } : formById(id);
  must(src && !src.deletedAt, 'This questionnaire no longer exists. It may be in the recycle bin.');
  UI.builder = { key: id, draft: clone({ name: src.name, description: src.description || '', audience: src.audience, questions: src.questions }), preview: false, errors: {} };
  return UI.builder;
}
function builderQuestion(q, i, n, err) {
  const choice = q.type === 'choice' || q.type === 'checkbox';
  return `<div class="bq ${err ? 'invalid' : ''}">
    <div class="bq-head">
      <span class="bq-num">Q${i + 1}</span>
      <label class="sr-only" for="bq-type-${i}">Question type</label><select id="bq-type-${i}" class="input input-inline" data-change="bq-type" data-q="${i}">${options(Object.entries(QTYPES), q.type)}</select>
      <label class="switch"><input type="checkbox" data-bq="${i}" data-bf="required" ${q.required ? 'checked' : ''}>Required</label>
      <div class="bq-tools">
        <button type="button" class="icon-btn" data-act="bq-move" data-q="${i}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">${ic('up', 17)}</button>
        <button type="button" class="icon-btn" data-act="bq-move" data-q="${i}" data-dir="1" ${i === n - 1 ? 'disabled' : ''} aria-label="Move down">${ic('down', 17)}</button>
        <button type="button" class="icon-btn" data-act="bq-dup" data-q="${i}" aria-label="Duplicate question">${ic('copy', 17)}</button>
        <button type="button" class="icon-btn" data-act="bq-del" data-q="${i}" ${n === 1 ? 'disabled' : ''} aria-label="Delete question">${ic('trash', 17)}</button>
      </div>
    </div>
    <label class="sr-only" for="bq-label-${i}">Question ${i + 1}</label><input id="bq-label-${i}" class="input bq-label ${err ? 'invalid' : ''}" data-bq="${i}" data-bf="label" value="${esc(q.label)}" placeholder="Question">
    <label class="sr-only" for="bq-help-${i}">Help text</label><input id="bq-help-${i}" class="input" data-bq="${i}" data-bf="help" value="${esc(q.help || '')}" placeholder="Help text shown under the question (optional)">
    ${q.type === 'rating' ? `<div class="form-grid"><div class="field"><label for="bq-low-${i}">Label for 1</label><input id="bq-low-${i}" class="input" data-bq="${i}" data-bf="low" value="${esc(q.low || '')}"></div><div class="field"><label for="bq-high-${i}">Label for 5</label><input id="bq-high-${i}" class="input" data-bq="${i}" data-bf="high" value="${esc(q.high || '')}"></div></div>` : ''}
    ${choice ? `<div class="stack-sm">${q.options.map((o, k) => `<div class="opt-row"><span class="marker ${q.type === 'checkbox' ? 'box' : ''}"></span><label class="sr-only" for="bq-o-${i}-${k}">Option ${k + 1}</label><input id="bq-o-${i}-${k}" class="input" data-bq="${i}" data-opt="${k}" value="${esc(o)}"><button type="button" class="icon-btn" data-act="bq-opt-del" data-q="${i}" data-opt="${k}" ${q.options.length <= 2 ? 'disabled' : ''} aria-label="Remove option">${ic('x', 16)}</button></div>`).join('')}<div><button type="button" class="link" data-act="bq-opt-add" data-q="${i}">Add option</button></div></div>` : ''}
    ${q.type === 'short' || q.type === 'paragraph' ? `<div class="help">Respondents type a ${q.type === 'short' ? 'one-line' : 'longer'} answer.</div>` : ''}
    ${err ? `<div class="field-error">${esc(err)}</div>` : ''}
  </div>`;
}
VIEWS.form = ({ id }) => {
  mustRole('admin');
  const b = builderFor(id), f = b.draft;
  const usedActive = id !== 'new' && DB.cycles.some(c => !c.deletedAt && c.status === 'active' && (c.peerFormId === id || c.managerFormId === id));
  const editor = `<div class="builder">
    <div class="panel form-meta">
      <label class="sr-only" for="bf-name">Questionnaire title</label><input id="bf-name" class="input title-input ${b.errors.name ? 'invalid' : ''}" data-bmeta="name" value="${esc(f.name)}" placeholder="Questionnaire title">
      ${b.errors.name ? `<div class="field-error">${esc(b.errors.name)}</div>` : ''}
      <label class="sr-only" for="bf-desc">Description</label><textarea id="bf-desc" class="input" rows="2" data-bmeta="description" placeholder="Description shown at the top of the form (optional)" style="min-height:60px">${esc(f.description)}</textarea>
      <div class="field" style="max-width:260px"><label for="bf-aud">Filled in by</label><select id="bf-aud" class="input" data-bmeta="audience">${options([['peer', 'Peers'], ['manager', 'Managers']], f.audience)}</select></div>

    <div class="row"><button type="button" class="btn" data-act="bq-add">${ic('plus', 16)}Add question</button></div>
  </div>`;
  const preview = `<div class="stack" style="max-width:860px">${notice('This is how respondents see the form. Answers here aren’t saved.', '', 'eye')}${f.description ? `<p class="muted">${esc(f.description)}</p>` : ''}${renderForm(f, { values: {}, errors: {} }, { prefix: 'pv' })}</div>`;
  return {

    actions: `<button type="button" class="btn" data-act="bq-preview">${b.preview ? 'Back to editing' : `${ic('eye', 16)}Preview`}</button><button type="button" class="btn btn-primary" data-act="bq-save">Save questionnaire</button>`,
    body: `<div class="stack">${usedActive ? notice('An open review cycle uses this questionnaire. Changes apply to responses that haven’t been submitted yet; submitted answers keep their original wording.', 'warn') : ''}${b.preview ? preview : editor}</div>`
  };
};
function markDirty() { UI.dirty = true; const d = $('#dirty-flag'); if (d) d.hidden = false; }
function bindBuilder(e) {
  const b = UI.builder;
  if (!b || UI.route.name !== 'form') return;
  const el = e.target;
  if (el.dataset.bmeta) { b.draft[el.dataset.bmeta] = el.value; markDirty(); return; }
  if (el.dataset.bq === undefined) return;
  const q = b.draft.questions[Number(el.dataset.bq)];
  if (el.dataset.opt !== undefined) q.options[Number(el.dataset.opt)] = el.value;
  else if (el.dataset.bf === 'required') q.required = el.checked;
  else q[el.dataset.bf] = el.value;
  markDirty();
}
const bmut = fn => { fn(UI.builder.draft.questions); markDirty(); render(); };
ACT['bq-add'] = () => bmut(qs => qs.push(newQuestion('paragraph')));
ACT['bq-del'] = el => bmut(qs => qs.splice(Number(el.dataset.q), 1));
ACT['bq-dup'] = el => bmut(qs => { const i = Number(el.dataset.q); qs.splice(i + 1, 0, { ...clone(qs[i]), id: uid('q') }); });
ACT['bq-move'] = el => bmut(qs => { const i = Number(el.dataset.q), j = i + Number(el.dataset.dir); [qs[i], qs[j]] = [qs[j], qs[i]]; });
ACT['bq-opt-add'] = el => bmut(qs => { const q = qs[Number(el.dataset.q)]; q.options.push(`Option ${q.options.length + 1}`); });
ACT['bq-opt-del'] = el => bmut(qs => qs[Number(el.dataset.q)].options.splice(Number(el.dataset.opt), 1));
ACT['bq-preview'] = () => { UI.builder.preview = !UI.builder.preview; render(); };
CHANGE['bq-type'] = el => bmut(qs => {
  const q = qs[Number(el.dataset.q)], t = el.value;
  q.type = t;
  if (t === 'rating') { q.low = q.low || 'Needs improvement'; q.high = q.high || 'Outstanding'; }
  if ((t === 'choice' || t === 'checkbox') && !(q.options?.length >= 2)) q.options = ['Option 1', 'Option 2'];
});
ACT['bq-save'] = () => {
  const b = UI.builder, f = b.draft, errs = {};
  if (!f.name.trim()) errs.name = 'Give the questionnaire a title.';
  f.questions.forEach(q => {
    if (!q.label.trim()) errs[q.id] = 'Write the question.';
    else if ((q.type === 'choice' || q.type === 'checkbox') && q.options.filter(o => o.trim()).length < 2) errs[q.id] = 'Give at least two options.';
    if (q.options) q.options = q.options.map(o => o.trim()).filter(Boolean);
  });
  b.errors = errs;
  if (Object.keys(errs).length) { b.preview = false; render(); toast('Some questions need fixing before you can save.', 'bad'); return; }
  const saved = Data.saveForm(b.key === 'new' ? null : b.key, f);
  UI.dirty = false;
  UI.builder = null;
  toast('Questionnaire saved');
  go('form', { id: saved.id });
};

  return pill('Active', 'ok');
}

function tabBackups() {
  const list = Backups.list();

  return `<div class="stack">
    <div class="facts">
      <div class="fact"><span class="fact-label">Last backup</span><span class="fact-value sm">${last ? `${esc(relTime(last.at))}` : 'None yet'}</span><span class="help">${last ? esc(BACKUP_KIND[last.kind]) : ''}</span></div>
      <div class="fact"><span class="fact-label">Stored backups</span><span class="fact-value">${list.length}<span class="kpi-of"> / ${MAX_BACKUPS}</span></span><span class="help">${esc(fmtBytes(total))} in total</span></div>
      <div class="fact"><span class="fact-label">Automatic backups</span><span class="fact-value sm">${DB.settings.autoBackup ? 'Daily' : 'Off'}</span><span class="help">${DB.settings.autoBackup ? 'Taken at the first admin sign-in each day' : 'Turn on in Security settings'}</span></div>
      <div class="fact"><span class="fact-label">Where data is kept</span><span class="fact-value sm">${Local.persistent ? 'This browser' : 'This tab only'}</span><span class="help">${Local.persistent ? 'Download a backup to keep an off-site copy' : 'Saving is blocked here; download a backup'}</span></div>
    </div>
    <div class="row">
      <button type="button" class="btn btn-primary" data-act="backup-now">${ic('restore', 16)}Back up now</button>
      <button type="button" class="btn" data-act="backup-download-current">${ic('download', 16)}Download current data</button>
      <button type="button" class="btn" data-act="restore-file-pick">${ic('upload', 16)}Restore from a file</button>
      <input type="file" id="restore-file" accept=".json,application/json" data-change="restore-file" hidden>
    </div>
    ${notice('Every backup carries a SHA-256 checksum. A restore is refused if the checksum doesn’t match, and the current data is backed up automatically before any restore or permanent delete, so each of those can be undone.', '', 'shield')}
    ${list.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>Created</th><th>Type</th><th>Contents</th><th>Size</th><th>Checksum</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>
      ${list.map(b => `<tr><td class="nowrap"><b>${esc(fmtDateTime(b.at))}</b><div class="person-sub">${esc(b.label)}${b.by ? ` · ${esc(nameOf(b.by))}` : ''}</div></td><td>${pill(BACKUP_KIND[b.kind], b.kind === 'manual' ? 'accent' : b.kind === 'auto' ? 'info' : 'mark')}</td><td class="muted">${esc(countsText(b.counts))}</td><td class="num muted nowrap">${esc(fmtBytes(b.bytes))}</td><td><code title="${esc(b.sha256)}">${esc(b.sha256.slice(0, 12))}…</code></td>
        <td class="actions"><div class="row" style="justify-content:flex-end"><button type="button" class="btn btn-sm" data-act="backup-restore" data-id="${b.id}">Restore</button><button type="button" class="icon-btn" data-act="backup-download" data-id="${b.id}" aria-label="Download this backup" title="Download">${ic('download', 17)}</button><button type="button" class="icon-btn" data-act="backup-delete" data-id="${b.id}" aria-label="Delete this backup" title="Delete backup">${ic('trash', 17)}</button></div></td></tr>`).join('')}
    </tbody></table></div>` : emptyState('No backups yet', 'Create the first backup now. Automatic backups are taken daily when an HR admin signs in.')}
    <p class="table-foot">The ${MAX_BACKUPS} most recent backups are kept; the oldest automatic one is replaced first. This prototype stores data in the browser. A production deployment keeps the same records in a server database with scheduled off-site backups.</p>

}

ACT['backup-restore'] = el => {

    title: `Restore the backup from ${fmtDateTime(b.at)}?`, kind: 'danger', confirm: 'Restore backup',

    run: async () => {
      if (!(await Backups.verify(b))) throw new UserError('This backup failed its integrity check (checksum mismatch), so it wasn’t restored.');

function afterRestore() {
  UI.builder = null; UI.answers = null; UI.dirty = false; UI.cycleId = null;
  if (!ME()) { signOut('restored'); return; }
  toast('Data restored');
  render();
}
ACT['restore-file-pick'] = () => $('#restore-file').click();
CHANGE['restore-file'] = async el => {
  const file = el.files[0];
  el.value = '';
  if (!file) return;
  if (file.size > 20 * 1048576) throw new UserError('That file is larger than 20 MB, so it isn’t a Fairmark backup.');
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e) { throw new UserError('That file isn’t valid JSON. Choose a backup file downloaded from Fairmark.'); }
  if (!obj || obj.app !== 'fairmark-appraisals' || typeof obj.data !== 'string') throw new UserError('That file isn’t a Fairmark backup.');
  if ((await sha256(obj.data)) !== obj.sha256) throw new UserError('This file failed its integrity check (checksum mismatch). It may be damaged or edited, so it can’t be restored.');
  let data;
  try { data = JSON.parse(obj.data); validateShape(data); } catch (e) { throw new UserError('This backup is missing required data, so it can’t be restored.'); }
  confirmModal({
    title: 'Restore from this file?', kind: 'danger', confirm: 'Restore',
    body: `<p><b>${esc(file.name)}</b><br><span class="muted">Created ${esc(fmtDateTime(obj.createdAt || obj.exportedAt))} · ${esc(countsText(countsOf(data)))}</span></p><p>All current data is replaced. A backup of the current data is taken first, so you can switch back.</p>`,
    run: async () => { await Backups.restoreData(obj.data, `the file "${file.name}"`); afterRestore(); }
  });
};

    ${items.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>Item</th><th>Type</th><th>Deleted</th><th>Removed for good</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>

function auditRows() {
  const list = auditFiltered(), shown = list.slice(0, 200);
  return { list, html: shown.length ? shown.map(a => `<tr><td class="nowrap mono" style="font-size:12px">${esc(fmtDateTime(a.at))}</td><td class="nowrap">${a.actorId ? esc(nameOf(a.actorId)) : '<span class="muted">System</span>'}</td><td class="nowrap">${a.action === 'auth.failed' || a.action === 'auth.locked' || a.action === 'access.denied' ? `<span class="t-bad">${esc(AUDIT_LABEL[a.action])}</span>` : esc(AUDIT_LABEL[a.action] || a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('') : '<tr><td colspan="4" class="muted" style="text-align:center; padding:28px">No entries match.</td></tr>' };
}
function tabAudit() {
  const f = UI.auditFilter, r = auditRows();
  return `<div class="stack-sm">
    <div class="toolbar">
      <label class="sr-only" for="au-q">Search the audit log</label><input id="au-q" class="input search" type="search" placeholder="Search people or details" value="${esc(f.q)}" data-input="audit-q">
      <label class="sr-only" for="au-cat">Category</label><select id="au-cat" class="input" data-change="audit-cat"><option value="">All activity</option>${options(Object.entries(AUDIT_CATS), f.cat)}</select>
      <button type="button" class="btn" data-act="audit-export" style="margin-left:auto">${ic('download', 16)}Export CSV</button>
    </div>
    <div class="table-wrap"><table class="t"><thead><tr><th>Time</th><th>Person</th><th>Action</th><th>Detail</th></tr></thead><tbody id="audit-tbody">${r.html}</tbody></table></div>
    <p class="table-foot" id="audit-foot">${r.list.length > 200 ? `Showing the latest 200 of ${r.list.length} entries. Export to see all.` : `${plural(r.list.length, 'entry', 'entries')}`}. The log is append-only: entries can’t be edited or deleted from the app.</p>
  </div>`;
}
INPUT['audit-q'] = el => { UI.auditFilter.q = el.value; const r = auditRows(); $('#audit-tbody').innerHTML = r.html; $('#audit-foot').textContent = `${plural(r.list.length, 'entry', 'entries')} match.`; };
CHANGE['audit-cat'] = el => { UI.auditFilter.cat = el.value; render(); };
ACT['audit-export'] = async () => { const list = auditFiltered(); audit('data.exported', `Exported ${plural(list.length, 'audit entry', 'audit entries')} as CSV`); save(); await offerFile(`fairmark-audit-log-${todayYMD()}.csv`, auditCSV(list)); };

function tabSettings() {
  const s = DB.settings;
  const num = (id, label, val, min, max, help) => `<div class="field"><label for="${id}">${label}</label><input id="${id}" class="input" type="number" min="${min}" max="${max}" value="${val}" inputmode="numeric"><span class="help">${help}</span></div>`;
  return `<form id="settings-form" class="stack" novalidate style="max-width:760px">
    <div class="panel stack-sm"><h3>Organisation</h3>
      <div class="field"><label for="st-org">Organisation name</label><input id="st-org" class="input" value="${esc(s.orgName)}"><span class="help">Shown on the sign-in page and in the sidebar.</span></div>
    </div>
    <div class="panel stack-sm"><h3>Confidentiality</h3>
      <label class="switch"><input type="checkbox" id="st-anon" ${s.anonymizePeers ? 'checked' : ''}>Hide peer names from managers</label>
      <p class="help">When on, managers see peer answers labelled Peer A, Peer B and so on. HR admins always see who wrote each response. Peers never see anyone else’s answers either way.</p>
    </div>
    <div class="panel stack-sm"><h3>Sign-in and sessions</h3>
      <div class="form-grid">
        ${num('st-session', 'Sign out after inactivity (minutes)', s.sessionMinutes, 5, 240, 'Applies to every role.')}
        ${num('st-minpw', 'Minimum password length', s.minPwLength, 8, 64, 'Passwords also need a letter and a number.')}
        ${num('st-attempts', 'Failed attempts before lockout', s.maxAttempts, 3, 10, 'Counted per account.')}
        ${num('st-lock', 'Lockout length (minutes)', s.lockMinutes, 1, 1440, 'HR admins can unlock an account sooner.')}
      </div>
    </div>
    <div class="panel stack-sm"><h3>Retention and backups</h3>
      <div class="form-grid">${num('st-retention', 'Keep deleted items for (days)', s.retentionDays, 7, 365, 'After this, items in the recycle bin are removed for good.')}</div>
      <label class="switch"><input type="checkbox" id="st-auto" ${s.autoBackup ? 'checked' : ''}>Take an automatic backup each day</label>
    </div>
    <div class="row"><button type="submit" class="btn btn-primary">Save settings</button></div>
  </form>`;
}
FORMS['settings-form'] = () => {
  mustRole('admin');
  const int = (id, min, max, label) => { const v = Number(fieldVal(id)); if (!Number.isInteger(v) || v < min || v > max) throw new UserError(`${label} must be a whole number from ${min} to ${max}.`); return v; };
  const org = (fieldVal('st-org') || '').trim();
  if (!org) throw new UserError('Enter the organisation name.');
  const next = {
    orgName: org, anonymizePeers: fieldVal('st-anon'), autoBackup: fieldVal('st-auto'),
    sessionMinutes: int('st-session', 5, 240, 'Sign-out time'), minPwLength: int('st-minpw', 8, 64, 'Minimum password length'),
    maxAttempts: int('st-attempts', 3, 10, 'Failed attempts'), lockMinutes: int('st-lock', 1, 1440, 'Lockout length'), retentionDays: int('st-retention', 7, 365, 'Retention')
  };
  const changed = Object.keys(next).filter(k => next[k] !== DB.settings[k]);
  if (!changed.length) { toast('Nothing changed', 'warn'); return; }
  Object.assign(DB.settings, next);
  audit('settings.updated', `Changed ${changed.length} setting${changed.length === 1 ? '' : 's'}: ${changed.join(', ')}`);
  save();
  toast('Settings saved');
  render();
};

/* ---------- Account ---------- */
VIEWS.account = (route, me) => {
  const forced = me.mustChange;
  const s = DB.settings;
  return {
    title: forced ? 'Choose a new password' : 'Your account', eyebrow: ROLE_LABEL[me.role],
    sub: forced ? 'You signed in with a temporary password. Choose your own to continue.' : '',
    body: `<div class="grid-2" style="max-width:960px; align-items:start">
      <form id="pw-form" class="panel stack-sm" novalidate>
        <h3>Change password</h3>
        <div class="field"><label for="pw-cur">${forced ? 'Temporary password' : 'Current password'}</label><input id="pw-cur" class="input" type="password" autocomplete="current-password"></div>
        <div class="field"><label for="pw-new">New password</label><input id="pw-new" class="input" type="password" autocomplete="new-password"><span class="help">At least ${s.minPwLength} characters, with a letter and a number.</span></div>
        <div class="field"><label for="pw-conf">Confirm new password</label><input id="pw-conf" class="input" type="password" autocomplete="new-password"></div>
        <div id="pw-error" class="form-error" role="alert" hidden></div>
        <div><button type="submit" class="btn btn-primary">${forced ? 'Save and continue' : 'Change password'}</button></div>
      </form>
      ${forced ? '' : `<div class="panel stack-sm"><h3>Profile</h3>
        ${personCell(me)}
        <div class="answers" style="margin-top:6px">
          <div class="ans"><span class="ans-q">Email</span><span>${esc(me.email)}</span></div>
          <div class="ans"><span class="ans-q">Role</span><span>${esc(ROLE_LABEL[me.role])}</span></div>
          <div class="ans"><span class="ans-q">Reports to</span><span>${me.managerId ? esc(nameOf(me.managerId)) : '—'}</span></div>
          <div class="ans"><span class="ans-q">This session</span><span>Signed in ${esc(fmtTime(Session.data.startedAt))}. You’re signed out after ${s.sessionMinutes} minutes without activity.</span></div>
        </div>
        <p class="help">To change your name, email or manager, contact HR.</p></div>`}
    </div>`
  };
};
FORMS['pw-form'] = async () => {
  const err = $('#pw-error');
  try {
    await Data.changeOwnPassword(fieldVal('pw-cur'), fieldVal('pw-new'), fieldVal('pw-conf'));
    toast('Password changed');
    const me = ME();
    UI.route = { name: ROUTES[me.role].home };
    render();
  } catch (e) {
    if (e instanceof UserError) { err.textContent = e.message; err.hidden = false; } else throw e;
  }
};

/* ---------- Notifications ---------- */
VIEWS.notifications = (route, me) => {
  const mine = DB.notifications.filter(n => n.userId === me.id).sort((a, b) => b.at.localeCompare(a.at));
  if (!UI.notifSeen) UI.notifSeen = new Set(mine.filter(n => !n.read).map(n => n.id));
  return {
    title: 'Notifications', eyebrow: ROLE_LABEL[me.role],
    sub: mine.length ? plural(mine.length, 'notification') : '',
    body: mine.length ? `<div class="panel" style="padding-block:6px; max-width:860px"><div class="feed">${mine.map(n => `<div class="feed-item"><div>${UI.notifSeen.has(n.id) ? '<span class="pill mark plain" style="margin-right:8px">New</span>' : ''}${esc(n.text)}</div><span class="feed-time" title="${esc(fmtDateTime(n.at))}">${esc(relTime(n.at))}</span></div>`).join('')}</div></div>` : emptyState('No notifications', 'Reminders from HR and updates about your reviews appear here.'),
    mount() {
      let changed = false;
      mine.forEach(n => { if (!n.read) { n.read = true; changed = true; } });
      if (changed) { save(); const nb = $$('.nav-item').find(b => b.dataset.to === 'notifications'); nb?.querySelector('.nav-count')?.remove(); }
    }
  };
};

/* =====================================================================
   Boot
   ===================================================================== */
(function init() {
  const raw = Local.get(KEYS.db);
  let fresh = false;
  if (raw) {
    try { DB = migrate(JSON.parse(raw)); validateShape(DB); }
    catch (e) {
      try { Local.set(`${KEYS.db}.unreadable-${Date.now()}`, raw); } catch (e2) { /* keep going */ }
      DB = null;
      UI.flash = { tone: 'warn', text: 'Saved data couldn’t be read, so a fresh demo workspace was created. An HR admin can restore the last backup from Data protection.' };
    }
  }
  if (!DB) { DB = buildSeed(); fresh = true; }
  Session.load();
  Boot.ready = (async () => {
    if (!fresh) return;
    await Promise.all(DB.users.map(async u => { u.pwHash = await hashPassword(DEMO_PASSWORD, u.salt); }));
    try { save(); await Backups.create('auto', 'Initial setup', null); } catch (e) { /* storage unavailable */ }
  })();
  if (!fresh) autoPurge();
  render();
  getDownloads();
  setTimeout(getDownloads, 1500);
})();

</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Fairmark Appraisals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400..700;1,400&display=swap">
<style>
:root{
  /* Layout: a fixed left rail of role-specific navigation beside a scrolling work area; the rail folds into a top bar on phones. */
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --surface-3:#DAE3DF;
  --ink:#16201C; --muted:#56645E; --faint:#8A9791; --line:#D3DCD8;
  --accent:#1D5C4F; --accent-hover:#164A3F; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5;
  --mark:#D48A1C; --mark-soft:#F7E8CC; --mark-ink:#2E1E04;
  --brand-deep:#173F37; --brand-deep-ink:#E9F2EE; --brand-deep-muted:#A8C3B9; --brand-deep-line:#2B5A50;
  --ok:#2A7548; --ok-soft:#DCEFE2; --warn:#8F5A0E; --warn-soft:#F7EACF;
  --bad:#B42318; --bad-soft:#FBE4E1; --bad-ink:#FFFFFF; --info:#2B5891; --info-soft:#E0EAF6;
  --knob:#FFFFFF; --overlay:rgba(14,22,19,.45);
  --shadow:0 1px 2px rgba(18,32,28,.06), 0 10px 30px rgba(18,32,28,.10);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs-xs:12px; --fs-sm:13px; --fs-base:14.5px; --fs-md:16px; --fs-lg:19px; --fs-xl:24px; --fs-2xl:32px;
  --r-sm:6px; --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --surface:#151E1B; --surface-2:#1C2724; --surface-3:#273430;
    --ink:#E4ECE8; --muted:#9AA8A2; --faint:#6E7C76; --line:#2B3833;
    --accent:#62B9A3; --accent-hover:#7DC9B5; --accent-ink:#07110E; --accent-soft:#1A3731;
    --mark:#E8A93F; --mark-soft:#392B12; --mark-ink:#1D1304;
    --brand-deep:#10241F; --brand-deep-ink:#E2EEE9; --brand-deep-muted:#8FB0A5; --brand-deep-line:#24443C;
    --ok:#5CC488; --ok-soft:#163223; --warn:#E3B04B; --warn-soft:#382B11;
    --bad:#F07A6C; --bad-soft:#3B1C18; --bad-ink:#1A0806; --info:#88AEE5; --info-soft:#19283D;
    --knob:#E4ECE8; --overlay:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#151E1B; --surface-2:#1C2724; --surface-3:#273430;
  --ink:#E4ECE8; --muted:#9AA8A2; --faint:#6E7C76; --line:#2B3833;
  --accent:#62B9A3; --accent-hover:#7DC9B5; --accent-ink:#07110E; --accent-soft:#1A3731;
  --mark:#E8A93F; --mark-soft:#392B12; --mark-ink:#1D1304;
  --brand-deep:#10241F; --brand-deep-ink:#E2EEE9; --brand-deep-muted:#8FB0A5; --brand-deep-line:#24443C;
  --ok:#5CC488; --ok-soft:#163223; --warn:#E3B04B; --warn-soft:#382B11;
  --bad:#F07A6C; --bad-soft:#3B1C18; --bad-ink:#1A0806; --info:#88AEE5; --info-soft:#19283D;
  --knob:#E4ECE8; --overlay:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}

html,body,#app{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:var(--fs-base); line-height:1.5; -webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3{margin:0; text-wrap:balance}
p{margin:0}
code,.mono{font-family:var(--font-mono); font-size:.92em}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .num{font-variant-numeric:tabular-nums}
.t-bad{color:var(--bad); font-weight:600} .t-warn{color:var(--warn); font-weight:600} .t-ok{color:var(--ok); font-weight:600}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:grid; gap:24px}
.stack-sm{display:grid; gap:12px}
.ic{flex:none}

/* ---------- App shell ---------- */
.shell{display:grid; grid-template-columns:244px minmax(0,1fr); min-height:100%}
.side{position:sticky; top:env(safe-area-inset-top,0px); align-self:start; height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:22px; padding-block:22px 18px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:14px; background:var(--surface); border-right:1px solid var(--line); overflow-y:auto}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:21px; letter-spacing:-.015em; line-height:1}
.org{font-size:var(--fs-xs); color:var(--muted); margin-top:6px; padding-left:38px}
.mark-logo .m{fill:var(--mark)} .mark-logo .o{fill:none; stroke:currentColor; stroke-width:1.3; opacity:.45}
.nav{display:grid; gap:2px}
.nav-item{display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border:0; border-radius:var(--r-sm); background:none; color:var(--muted); font:inherit; font-weight:600; font-size:var(--fs-sm); text-align:left; cursor:pointer; white-space:nowrap}
.nav-item:hover{background:var(--surface-2); color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-soft); color:var(--accent)}
.nav-count{margin-left:auto; min-width:20px; padding:0 6px; border-radius:99px; background:var(--mark); color:var(--mark-ink); font-size:11px; font-weight:700; text-align:center; line-height:18px; font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto; display:grid; gap:12px; padding-top:16px; border-top:1px solid var(--line)}
.role-tag{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}
.main{min-width:0; padding-block:30px 72px; padding-left:clamp(20px,3.2vw,44px); padding-right:max(24px, env(safe-area-inset-right,0px))}
.content{max-width:1160px; margin-inline:auto}

@media (max-width: 900px){
  .shell{display:block}
  .side{position:static; height:auto; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px 10px; padding-block:14px 10px; padding-right:max(16px, env(safe-area-inset-right,0px)); border-right:0; border-bottom:1px solid var(--line); overflow:visible}
  .side-top{grid-column:1; min-width:0}
  .side-foot{grid-column:2; grid-row:1; margin:0; padding:0; border:0; align-self:center}
  .side-foot .person{display:none}
  .nav{grid-column:1 / -1; display:flex; gap:4px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin}
  .nav-item{width:auto; flex:none}
  .nav-count{margin-left:4px}
  .main{padding-block:22px 64px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
}

/* ---------- Page header & sections ---------- */
.page-head{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px 24px; margin-bottom:26px}
.page-head h1{font-family:var(--font-display); font-size:var(--fs-2xl); font-weight:650; letter-spacing:-.022em; line-height:1.08}
.page-head .sub{margin-top:8px; color:var(--muted); max-width:72ch; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center}
.eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
.back{display:inline-flex; align-items:center; gap:4px; margin-bottom:12px; padding:0; border:0; background:none; color:var(--muted); font:inherit; font-size:var(--fs-sm); font-weight:600; cursor:pointer}
.back:hover{color:var(--ink)}
.section{display:grid; gap:12px; min-width:0}
.section-head{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 16px}
.section-head h2{font-family:var(--font-display); font-size:var(--fs-lg); font-weight:600; letter-spacing:-.01em}
.section-head p{color:var(--muted); font-size:var(--fs-sm)}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px; min-width:0}
.panel h3{font-family:var(--font-display); font-size:var(--fs-md); font-weight:600; margin-bottom:14px}
.grid-2{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap:20px; align-items:start}

/* ---------- KPI strip ---------- */
.kpis{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.kpi{background:var(--surface); padding:18px 20px; display:grid; gap:8px; align-content:start}
.kpi-label{font-size:var(--fs-xs); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.kpi-value{font-family:var(--font-display); font-size:31px; font-weight:600; letter-spacing:-.02em; line-height:1.05; font-variant-numeric:tabular-nums}
.kpi-of{font-family:var(--font-body); font-size:var(--fs-md); font-weight:500; color:var(--muted); letter-spacing:0}
.kpi-foot{font-size:var(--fs-xs); color:var(--muted)}
@media (max-width: 1080px){ .kpis{grid-template-columns:repeat(2, minmax(0,1fr))} }
@media (max-width: 520px){ .kpis{grid-template-columns:minmax(0,1fr)} }

/* ---------- Bars ---------- */
.bar{display:flex; height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.bar > i{display:block; height:100%; background:var(--accent)}
.bar > i.ok{background:var(--ok)} .bar > i.mark{background:var(--mark)} .bar > i.info{background:var(--info)}
.bar.thick{height:12px}
.legend{display:grid; gap:10px; margin-top:16px}
.legend-row{display:grid; grid-template-columns:12px minmax(0,1fr) auto; gap:10px; align-items:center; font-size:var(--fs-sm)}
.legend-row .sw{width:10px; height:10px; border-radius:3px}
.legend-row b{font-variant-numeric:tabular-nums}
.sw.info{background:var(--info)} .sw.mark{background:var(--mark)} .sw.ok{background:var(--ok)}
.progress-cell{display:grid; gap:5px; min-width:110px}
.progress-cell .num{font-size:var(--fs-xs); color:var(--muted)}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table.t{width:100%; border-collapse:collapse; font-size:var(--fs-sm)}
.t th{padding:10px 14px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
.t td{padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--bg)}
.t td.actions{text-align:right; white-space:nowrap}
.t .nowrap{white-space:nowrap}
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.toolbar .input{width:auto; min-width:0}
.toolbar .search{flex:1 1 220px; max-width:320px}
.table-foot{font-size:var(--fs-xs); color:var(--muted)}

/* ---------- People ---------- */
.person{display:flex; align-items:center; gap:10px; min-width:0}
.av{width:30px; height:30px; flex:none; display:grid; place-items:center; border-radius:50%; background:var(--surface-3); color:var(--ink); font-size:11.5px; font-weight:700; letter-spacing:.02em}
.av.lg{width:42px; height:42px; font-size:14px}
.person-text{min-width:0}
.person-name{font-weight:600; line-height:1.3}
.person-sub{font-size:var(--fs-xs); color:var(--muted); line-height:1.35}

/* ---------- Pills & chips ---------- */
.pill{display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border-radius:99px; background:var(--surface-2); color:var(--muted); font-size:12px; font-weight:600; line-height:1.6; white-space:nowrap}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.pill.plain::before{display:none}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.mark,.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.pill.info{background:var(--info-soft); color:var(--info)}
.pill.accent{background:var(--accent-soft); color:var(--accent)}
.chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.chip{display:inline-flex; align-items:center; gap:4px; padding:3px 4px 3px 10px; border-radius:99px; background:var(--surface-2); font-size:12.5px; font-weight:500; white-space:nowrap}
.chip.locked{padding-right:10px}
.chip.done{background:var(--ok-soft)}
.chip.draft{background:var(--warn-soft)}
.chip .ic{color:var(--ok)}
.chip button{display:grid; place-items:center; width:20px; height:20px; padding:0; border:0; border-radius:50%; background:none; color:var(--muted); cursor:pointer}
.chip button:hover{background:var(--surface-3); color:var(--ink)}
select.add-peer{width:auto; padding:3px 26px 3px 10px; border-radius:99px; font-size:12.5px; border-style:dashed}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:8px 14px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); color:var(--ink); font:inherit; font-size:var(--fs-sm); font-weight:600; line-height:1.3; white-space:nowrap; cursor:pointer; transition:background-color .15s, border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover); border-color:var(--accent-hover)}
.btn-danger{color:var(--bad)}
.btn-danger:hover{background:var(--bad-soft)}
.btn-danger-solid{background:var(--bad); border-color:var(--bad); color:var(--bad-ink)}
.btn-danger-solid:hover{filter:brightness(1.07); background:var(--bad)}
.btn-ghost{background:transparent; border-color:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:5px 10px; font-size:12.5px}
.btn-block{width:100%}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5; cursor:not-allowed}
.icon-btn{display:grid; place-items:center; width:32px; height:32px; padding:0; border:0; border-radius:var(--r-sm); background:none; color:var(--muted); cursor:pointer}
.icon-btn:hover{background:var(--surface-2); color:var(--ink)}
.icon-btn:disabled{opacity:.3; cursor:default; background:none}
.link{padding:0; border:0; background:none; color:var(--accent); font:inherit; font-weight:600; text-decoration:underline; text-underline-offset:3px; cursor:pointer}

/* ---------- Form controls ---------- */
.input{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); color:var(--ink); font:inherit; font-size:var(--fs-base); transition:border-color .15s, box-shadow .15s}
.input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.input:disabled{background:var(--bg); color:var(--muted)}
.input.invalid{border-color:var(--bad)}
textarea.input{min-height:100px; resize:vertical; line-height:1.55}
select.input{cursor:pointer}
.input-inline{width:auto; padding-block:7px; font-size:var(--fs-sm); font-weight:600}
.field{display:grid; gap:6px; align-content:start; min-width:0}
.field > label,.field-label{font-size:var(--fs-sm); font-weight:600}
.help{font-size:var(--fs-xs); color:var(--muted)}
.field-error,.form-error{color:var(--bad); font-size:var(--fs-xs); font-weight:600}
.form-error{font-size:var(--fs-sm); padding:10px 12px; border-radius:var(--r-sm); background:var(--bad-soft)}
.form-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px}
.form-grid .span-2{grid-column:1 / -1}
@media (max-width: 560px){ .form-grid{grid-template-columns:minmax(0,1fr)} }
.switch{display:inline-flex; align-items:center; gap:10px; font-size:var(--fs-sm); font-weight:600; cursor:pointer}
.switch input{appearance:none; -webkit-appearance:none; position:relative; flex:none; width:36px; height:20px; margin:0; border-radius:99px; background:var(--surface-3); cursor:pointer; transition:background-color .15s}
.switch input::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--knob); box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(16px)}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:64px}
.pw-toggle{position:absolute; right:6px; top:50%; transform:translateY(-50%); padding:4px 8px; border:0; border-radius:4px; background:none; color:var(--muted); font:inherit; font-size:var(--fs-xs); font-weight:700; cursor:pointer}
.pw-toggle:hover{background:var(--surface-2); color:var(--ink)}

/* ---------- Notices, empty states ---------- */
.notice{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--r-sm); background:var(--info-soft); font-size:var(--fs-sm); line-height:1.5}
.notice > .ic{color:var(--info); margin-top:1px}
.notice.warn{background:var(--warn-soft)} .notice.warn > .ic{color:var(--warn)}
.notice.bad{background:var(--bad-soft)} .notice.bad > .ic{color:var(--bad)}
.notice.ok{background:var(--ok-soft)} .notice.ok > .ic{color:var(--ok)}
.empty{display:grid; justify-items:center; gap:8px; padding:40px 20px; border:1px dashed var(--line); border-radius:var(--r); text-align:center; color:var(--muted)}
.empty-title{font-family:var(--font-display); font-size:var(--fs-md); font-weight:600; color:var(--ink)}
.empty p{max-width:52ch}

/* ---------- Tabs ---------- */
.tabs{display:flex; gap:2px; margin-bottom:22px; border-bottom:1px solid var(--line); overflow-x:auto}
.tab{flex:none; margin-bottom:-1px; padding:10px 14px; border:0; border-bottom:2px solid transparent; background:none; color:var(--muted); font:inherit; font-size:var(--fs-sm); font-weight:600; white-space:nowrap; cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tab .nav-count{margin-left:6px; display:inline-block}

/* ---------- Questionnaire (respondent) ---------- */
.qlist{display:grid; gap:14px}
.q{display:grid; gap:14px; padding:20px 22px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
.q.has-error{border-color:var(--bad)}
.q-head{display:flex; gap:14px; align-items:baseline}
.q-num{flex:none; font-family:var(--font-mono); font-size:var(--fs-xs); color:var(--faint)}
.q-label{font-size:var(--fs-md); font-weight:600; line-height:1.4}
.req{margin-left:3px; color:var(--bad)}
.q .help{margin-top:3px; font-size:var(--fs-sm)}
.q > .scale,.q > .scale-ends,.q > .opts,.q > .input,.q > .field-error{margin-left:34px}
@media (max-width: 560px){ .q{padding:16px} .q > .scale,.q > .scale-ends,.q > .opts,.q > .input,.q > .field-error{margin-left:0} }
.scale{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:6px; max-width:400px}
.scale-opt{position:relative}
.scale-opt input{position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer}
.scale-opt span{display:grid; place-items:center; height:44px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); font-weight:700; font-variant-numeric:tabular-nums; transition:background-color .12s, border-color .12s}
.scale-opt input:hover:not(:disabled) + span{border-color:var(--mark)}
.scale-opt input:checked + span{background:var(--mark); border-color:var(--mark); color:var(--mark-ink)}
.scale-opt input:focus-visible + span{outline:2px solid var(--accent); outline-offset:2px}
.scale-opt input:disabled{cursor:default}
.scale-opt input:disabled:not(:checked) + span{color:var(--faint)}
.scale-ends{display:flex; justify-content:space-between; gap:12px; max-width:400px; margin-top:-6px; font-size:var(--fs-xs); color:var(--muted)}
.opts{display:grid; gap:6px; max-width:520px}
.opt{display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); cursor:pointer}

function migrate(d) {
  d.meta = d.meta || { schema: 1, createdAt: nowISO(), app: 'fairmark-appraisals' };
  d.settings = { ...defaultSettings(), ...(d.settings || {}) };
  for (const k of ['users', 'forms', 'cycles', 'reviews', 'responses', 'notifications', 'audit']) if (!Array.isArray(d[k])) d[k] = [];
  d.cycles.forEach(c => { c.reminders = c.reminders || {}; });
  return d;
}
function validateShape(d) {
  if (!d || typeof d !== 'object') throw new Error('not an object');
  for (const k of ['users', 'forms', 'cycles', 'reviews', 'responses']) if (!Array.isArray(d[k])) throw new Error('missing ' + k);
  if (!d.users.some(u => u.role === 'admin' && !u.deletedAt)) throw new Error('no admin');
}
function save() { Local.set(KEYS.db, JSON.stringify(DB)); }

/* ---------- Lookups ---------- */
const userById = id => DB.users.find(u => u.id === id);
const formById = id => DB.forms.find(f => f.id === id);
const cycleById = id => DB.cycles.find(c => c.id === id);
const reviewById = id => DB.reviews.find(r => r.id === id);
const isLiveUser = u => !!u && !u.deletedAt;
const isSubmitted = r => !!r && r.status === 'submitted';
const liveUsers = () => DB.users.filter(u => !u.deletedAt);
const departments = () => [...new Set(liveUsers().map(u => u.dept))].sort();
const managersList = () => liveUsers().filter(u => u.role === 'manager' && u.active).sort((a, b) => a.name.localeCompare(b.name));
const responseFor = (reviewId, respondentId, kind) => DB.responses.find(x => x.reviewId === reviewId && x.respondentId === respondentId && x.kind === kind && !x.deletedAt);
const reviewsOf = cycleId => DB.reviews.filter(r => r.cycleId === cycleId && !r.deletedAt && isLiveUser(userById(r.employeeId)));
function peerIdsOf(r) { return r.peerIds.filter(id => isLiveUser(userById(id)) || isSubmitted(responseFor(r.id, id, 'peer'))); }

function reviewStats(r) {
  const peers = peerIdsOf(r);
  const peerDone = peers.filter(id => isSubmitted(responseFor(r.id, id, 'peer'))).length;
  const mresp = r.managerId ? responseFor(r.id, r.managerId, 'manager') : null;
  const mgrDone = isSubmitted(mresp);
  const mgrDraft = !!mresp && mresp.status === 'draft';
  const peersComplete = peerDone >= peers.length;
  const stage = !peersComplete ? 'peers' : (mgrDone ? 'complete' : 'manager');
  return { peers, peerTotal: peers.length, peerDone, mgrDone, mgrDraft, mresp, stage };
}

function cycleStats(c) {
  const reviews = reviewsOf(c.id);
  const s = { reviews, employees: reviews.length, peerTotal: 0, peerDone: 0, mgrTotal: 0, mgrDone: 0, stages: { peers: 0, manager: 0, complete: 0 }, pending: new Map(), byDept: {}, stats: new Map(), noManager: 0 };
  const addPending = (userId, kind, review) => {
    if (!s.pending.has(userId)) s.pending.set(userId, { user: userById(userId), peer: [], manager: [] });
    s.pending.get(userId)[kind].push(review);
  };
  for (const r of reviews) {
    const st = reviewStats(r); s.stats.set(r.id, st);
    const dept = userById(r.employeeId).dept;
    const d = s.byDept[dept] || (s.byDept[dept] = { employees: 0, peerTotal: 0, peerDone: 0, mgrTotal: 0, mgrDone: 0, complete: 0 });
    d.employees++;
    s.stages[st.stage]++;
    if (st.stage === 'complete') d.complete++;
    s.peerTotal += st.peerTotal; s.peerDone += st.peerDone; d.peerTotal += st.peerTotal; d.peerDone += st.peerDone;
    for (const pid of st.peers) if (!isSubmitted(responseFor(r.id, pid, 'peer')) && isLiveUser(userById(pid))) addPending(pid, 'peer', r);
    if (r.managerId) {
      s.mgrTotal++; d.mgrTotal++;
      if (st.mgrDone) { s.mgrDone++; d.mgrDone++; } else addPending(r.managerId, 'manager', r);
    } else s.noManager++;
  }
  const open = c.status === 'active';
  s.peerOverdue = open && daysLeft(c.peerDeadline) < 0 ? s.peerTotal - s.peerDone : 0;
  s.mgrOverdue = open && daysLeft(c.managerDeadline) < 0 ? s.mgrTotal - s.mgrDone : 0;
  return s;
}

const Session = {
  data: null,
  load() { try { this.data = JSON.parse(Sess.get(KEYS.session) || 'null'); } catch (e) { this.data = null; } },
  start(userId) { this.data = { userId, startedAt: nowISO(), lastActive: Date.now() }; this.persist(); },
  touch() { if (this.data) { this.data.lastActive = Date.now(); this.persist(); } },
  persist() { Sess.set(KEYS.session, JSON.stringify(this.data)); },
  end() { this.data = null; Sess.remove(KEYS.session); },
  expired() { return !!this.data && Date.now() - this.data.lastActive > DB.settings.sessionMinutes * 60000; }
};
function ME() {
  if (!Session.data || !DB) return null;
  const u = userById(Session.data.userId);
  return u && !u.deletedAt && u.active ? u : null;
}

    for (const c of DB.cycles) {
      if (c.deletedAt || c.status === 'draft') continue;
      for (const r of reviewsOf(c.id)) {
        if (!r.peerIds.includes(me.id)) continue;
        out.push({ cycle: c, review: r, employee: userById(r.employeeId), response: responseFor(r.id, me.id, 'peer') });
      }
    }
    return out;
  },
  peerTask(reviewId) {
    const me = ME(), r = reviewById(reviewId);
    must(r && !r.deletedAt && r.peerIds.includes(me.id), 'This feedback request is not assigned to you.');
    const c = cycleById(r.cycleId);
    must(c && !c.deletedAt && c.status !== 'draft', 'This review cycle is not open yet.');
    return { cycle: c, review: r, employee: userById(r.employeeId), form: formById(c.peerFormId), response: responseFor(r.id, me.id, 'peer') };
  },
  myTeam() {
    const me = mustRole('manager'), out = [];
    for (const c of DB.cycles) {
      if (c.deletedAt || c.status === 'draft') continue;
      for (const r of reviewsOf(c.id)) {
        if (r.managerId !== me.id) continue;
        out.push({ cycle: c, review: r, employee: userById(r.employeeId), st: reviewStats(r), response: responseFor(r.id, me.id, 'manager') });
      }
    }
    return out;
  },
  /* Managers only ever receive submitted peer answers for their own direct reports.
     When peer anonymity is on, respondent identities never leave this function. */
  managerReview(reviewId) {
    const me = mustRole('manager'), r = reviewById(reviewId);
    must(r && !r.deletedAt && r.managerId === me.id, 'You can only open reviews for people who report to you.');
    const c = cycleById(r.cycleId);
    must(c && !c.deletedAt && c.status !== 'draft', 'This review cycle is not open yet.');
    const st = reviewStats(r), anon = DB.settings.anonymizePeers;
    const subs = st.peers.map(id => responseFor(r.id, id, 'peer')).filter(isSubmitted);
    const ordered = anon ? subs.slice().sort((a, b) => hashStr(a.id) - hashStr(b.id)) : subs.slice().sort((a, b) => a.submittedAt.localeCompare(b.submittedAt));
    const peers = ordered.map((resp, i) => ({
      label: anon ? `Peer ${String.fromCharCode(65 + i)}` : (userById(resp.respondentId)?.name || 'Former employee'),
      answers: clone(resp.answers), submittedAt: anon ? null : resp.submittedAt
    }));
    return { cycle: c, review: r, employee: userById(r.employeeId), peerTotal: st.peerTotal, peerDone: st.peerDone, peerForm: formById(c.peerFormId), managerForm: formById(c.managerFormId), peers, response: responseFor(r.id, me.id, 'manager'), anon };
  },
  adminPacket(reviewId) {
    mustRole('admin');
    const r = reviewById(reviewId);
    must(r && !r.deletedAt, 'This review no longer exists. It may be in the recycle bin.');
    const c = cycleById(r.cycleId);
    must(c && !c.deletedAt, 'This review cycle is in the recycle bin.');
    const st = reviewStats(r);
    const peers = st.peers.map(id => ({ user: userById(id), userId: id, response: responseFor(r.id, id, 'peer') }));
    return { cycle: c, review: r, employee: userById(r.employeeId), manager: userById(r.managerId), st, peers, peerForm: formById(c.peerFormId), managerForm: formById(c.managerFormId), mresp: st.mresp };
  }
};

/* ---------- Answer validation ---------- */
function validateAnswers(form, values) {
  const errs = {};
  for (const q of form.questions) {
    const v = values[q.id];
    const empty = v == null || v === '' || (Array.isArray(v) && !v.length) || (typeof v === 'string' && !v.trim());
    if (q.required && empty) {
      errs[q.id] = q.type === 'rating' ? 'Choose a rating from 1 to 5.' : q.type === 'choice' ? 'Choose one option.' : q.type === 'checkbox' ? 'Select at least one option.' : 'This question needs an answer.';
    } else if (q.required && q.type === 'paragraph' && typeof v === 'string' && v.trim().length < 20) {
      errs[q.id] = 'Add a little more detail (at least 20 characters).';
    }
  }
  return errs;
}

/* =====================================================================
   Writes: responses, admin operations, backups and the recycle bin
   ===================================================================== */
const Data = {
  saveResponse(reviewId, kind, values, submit) {
    const me = ME(), r = reviewById(reviewId);

    if (kind === 'peer') must(r.peerIds.includes(me.id), 'This feedback request is not assigned to you.');

    const c = cycleById(r.cycleId);
    if (!c || c.status !== 'active') throw new UserError('This review cycle is closed, so responses can no longer be changed.');
    let resp = responseFor(r.id, me.id, kind);
    if (isSubmitted(resp)) throw new UserError('You have already submitted this form.');

  async changeOwnPassword(current, next, confirm) {
    const me = ME();

    const probs = passwordProblems(next);
    if (probs.length) throw new UserError(`The new password needs ${probs.join(', ')}.`);
    if (next !== confirm) throw new UserError('The two new passwords don’t match.');
    if (current === next) throw new UserError('Choose a password that is different from the current one.');
    me.salt = randomHex(16);

      if (u.role === 'admin' && liveUsers().filter(x => x.role === 'admin').length < 2) throw new UserError('There must always be at least one HR admin.');

      if (c.status === 'active') notify(resp.respondentId, `HR reopened your ${resp.kind === 'peer' ? 'feedback' : 'assessment'} for ${emp.name}. Please complete it again.`);
    }
    save();
  }

function suggestPeers(u, managerId) {
  const rnd = mulberry32(hashStr(u.id + Date.now()));
  const pool = liveUsers().filter(x => x.id !== u.id && x.id !== managerId && x.active && x.role !== 'admin');
  const same = pool.filter(x => x.dept === u.dept && x.role === 'employee').sort(() => rnd() - 0.5);
  const others = pool.filter(x => !same.includes(x)).sort(() => rnd() - 0.5);
  return [...same, ...others].slice(0, 3).map(x => x.id);
}
function passwordProblems(pw) {
  const p = [], min = DB.settings.minPwLength;
  if (pw.length < min) p.push(`at least ${min} characters`);
  if (!/[A-Za-z]/.test(pw)) p.push('a letter');
  if (!/\d/.test(pw)) p.push('a number');
  return p;
}
function countsOf(d) {
  return {
    people: d.users.filter(u => !u.deletedAt).length,
    cycles: d.cycles.filter(c => !c.deletedAt).length,
    responses: d.responses.filter(r => !r.deletedAt && r.status === 'submitted').length
  };
}
const countsText = c => `${plural(c.people, 'person', 'people')} · ${plural(c.cycles, 'cycle')} · ${plural(c.responses, 'submitted response')}`;

/* ---------- Backups ---------- */
const BACKUP_KIND = { manual: 'Manual', auto: 'Automatic', 'pre-restore': 'Before restore', 'pre-purge': 'Before permanent delete' };
const Backups = {
  list() { try { return JSON.parse(Local.get(KEYS.backups) || '[]'); } catch (e) { return []; } },
  saveList(list) { Local.set(KEYS.backups, JSON.stringify(list)); },
  async create(kind, label, actorId) {
    const data = JSON.stringify(DB);
    const rec = { id: uid('bk'), at: nowISO(), kind, label, by: actorId === undefined ? (ME()?.id ?? null) : actorId, sha256: await sha256(data), bytes: data.length, counts: countsOf(DB), data };
    const list = this.list();
    list.unshift(rec);
    while (list.length > MAX_BACKUPS) {
      let idx = -1;
      for (let i = list.length - 1; i > 0; i--) if (list[i].kind === 'auto') { idx = i; break; }
      list.splice(idx > 0 ? idx : list.length - 1, 1);
    }
    try { this.saveList(list); }
    catch (e) {
      list.shift();
      throw new UserError('Browser storage is full, so the backup could not be stored. Delete older backups or download one instead.');
    }
    audit('data.backup', `${BACKUP_KIND[kind]} backup: ${label}`, rec.by);
    save();
    return rec;
  },
  get(id) { return this.list().find(b => b.id === id); },
  remove(id) {
    mustRole('admin');
    const b = this.get(id);
    this.saveList(this.list().filter(x => x.id !== id));
    audit('data.backup_deleted', `Deleted the backup from ${fmtDateTime(b.at)}`);
    save();
  },
  async verify(rec) { return (await sha256(rec.data)) === rec.sha256; },
  fileFor(rec) {
    return JSON.stringify({ app: 'fairmark-appraisals', format: 1, exportedAt: nowISO(), createdAt: rec.at, label: rec.label, counts: rec.counts, sha256: rec.sha256, data: rec.data }, null, 2);
  },
  async restoreData(dataStr, sourceLabel) {
    const me = mustRole('admin');
    const parsed = JSON.parse(dataStr);
    validateShape(parsed);
    await this.create('pre-restore', `Saved automatically before restoring ${sourceLabel}`);
    DB = migrate(parsed);
    audit('data.restored', `Restored data from ${sourceLabel}`, me.id);
    save();
  }
};
async function maybeAutoBackup() {
  if (!DB.settings.autoBackup) return;
  const last = Backups.list().find(b => b.kind === 'auto' || b.kind === 'manual');
  if (!last || Date.now() - new Date(last.at).getTime() > DAY) {
    try { await Backups.create('auto', 'Daily automatic backup'); } catch (e) { /* storage full: surfaced on the backups tab */ }
  }
}

/* ---------- Recycle bin ---------- */
const Bin = {
  items() {
    const out = [];
    const add = (type, x, title, sub) => out.push({ type, id: x.id, title, sub, deletedAt: x.deletedAt, deletedBy: x.deletedBy, reason: x.deletedReason || '' });
    DB.users.filter(u => u.deletedAt).forEach(u => add('user', u, u.name, `${u.title} · ${u.dept}`));
    DB.forms.filter(f => f.deletedAt).forEach(f => add('form', f, f.name, `${plural(f.questions.length, 'question')} · for ${f.audience === 'peer' ? 'peers' : 'managers'}`));
    DB.cycles.filter(c => c.deletedAt).forEach(c => {
      const nr = DB.reviews.filter(r => r.cycleId === c.id && !r.deletedAt).length;
      const ns = DB.responses.filter(r => r.cycleId === c.id && !r.deletedAt && r.status === 'submitted').length;
      add('cycle', c, c.name, `Includes ${plural(nr, 'review')} and ${plural(ns, 'submitted response')}`);
    });
    DB.reviews.filter(r => r.deletedAt && !cycleById(r.cycleId)?.deletedAt).forEach(r => add('review', r, `Review of ${userById(r.employeeId)?.name || 'former employee'}`, `Removed from ${cycleById(r.cycleId)?.name || 'a cycle'}`));
    DB.responses.filter(x => x.deletedAt && !reviewById(x.reviewId)?.deletedAt).forEach(x => {
      const r = reviewById(x.reviewId);
      add('response', x, `${x.kind === 'peer' ? 'Peer feedback' : 'Manager assessment'} about ${userById(r?.employeeId)?.name || 'former employee'}`, `From ${userById(x.respondentId)?.name || 'former employee'} · ${cycleById(x.cycleId)?.name || ''}`);
    });
    return out.sort((a, b) => b.deletedAt.localeCompare(a.deletedAt));
  },
  find(type, id) {
    const arr = { user: DB.users, form: DB.forms, cycle: DB.cycles, review: DB.reviews, response: DB.responses }[type];
    return arr.find(x => x.id === id);
  },
  restore(type, id) {
    mustRole('admin');
    const x = this.find(type, id);
    if (!x) throw new UserError('That item is no longer in the recycle bin.');
    if (type === 'user' && liveUsers().some(u => u.email.toLowerCase() === x.email.toLowerCase())) throw new UserError(`Another active person already uses ${x.email}. Change their email first.`);
    if (type === 'review') {
      if (cycleById(x.cycleId)?.deletedAt) throw new UserError('Restore the review cycle first.');
      if (!isLiveUser(userById(x.employeeId))) throw new UserError('Restore the employee first.');
      if (reviewsOf(x.cycleId).some(r => r.employeeId === x.employeeId)) throw new UserError('This employee is already in the cycle again.');
    }
    if (type === 'response') {
      if (reviewById(x.reviewId)?.deletedAt) throw new UserError('Restore the review first.');
      if (responseFor(x.reviewId, x.respondentId, x.kind)) throw new UserError('This person has since started a new response, so the old one can’t be restored.');
    }
    x.deletedAt = null; x.deletedBy = null; delete x.deletedReason;
    audit('bin.restored', `Restored ${this.describe(type, x)}`);
    save();
  },
  describe(type, x) {
    if (type === 'user') return x.name;
    if (type === 'form' || type === 'cycle') return `"${x.name}"`;
    if (type === 'review') return `the review of ${userById(x.employeeId)?.name || 'a former employee'}`;
    return `a response from ${userById(x.respondentId)?.name || 'a former employee'}`;
  },
  purgeCheck(type, id) {
    if (type === 'form') {
      const users = DB.cycles.filter(c => c.peerFormId === id || c.managerFormId === id);
      if (users.length) throw new UserError(`"${users[0].name}" still uses this questionnaire${users[0].deletedAt ? ' (it is in the recycle bin)' : ''}.`);
    }
  },
  purge(type, id, actor) {
    const x = this.find(type, id);
    if (!x) return;
    this.purgeCheck(type, id);
    const label = this.describe(type, x);
    if (type === 'user') {
      DB.reviews.filter(r => r.employeeId === id).forEach(r => { DB.responses = DB.responses.filter(s => s.reviewId !== r.id); });
      DB.reviews = DB.reviews.filter(r => r.employeeId !== id);
      DB.reviews.forEach(r => { r.peerIds = r.peerIds.filter(p => p !== id || isSubmitted(responseFor(r.id, p, 'peer'))); if (r.managerId === id && !isSubmitted(responseFor(r.id, id, 'manager'))) r.managerId = null; });
      DB.notifications = DB.notifications.filter(n => n.userId !== id);
      DB.users = DB.users.filter(u => u.id !== id);
    } else if (type === 'form') {
      DB.forms = DB.forms.filter(f => f.id !== id);
    } else if (type === 'cycle') {
      const rids = new Set(DB.reviews.filter(r => r.cycleId === id).map(r => r.id));
      DB.responses = DB.responses.filter(s => !rids.has(s.reviewId));
      DB.reviews = DB.reviews.filter(r => r.cycleId !== id);
      DB.cycles = DB.cycles.filter(c => c.id !== id);
    } else if (type === 'review') {
      DB.responses = DB.responses.filter(s => s.reviewId !== id);
      DB.reviews = DB.reviews.filter(r => r.id !== id);
    } else if (type === 'response') {
      DB.responses = DB.responses.filter(s => s.id !== id);
    }
    audit('bin.purged', `Permanently deleted ${label}`, actor);
  },
  async purgeWithBackup(items) {
    const me = mustRole('admin');
    for (const it of items) this.purgeCheck(it.type, it.id);
    await Backups.create('pre-purge', `Saved automatically before permanently deleting ${plural(items.length, 'item')}`);
    for (const it of items) this.purge(it.type, it.id, me.id);
    save();
  }
};
function autoPurge() {
  const cutoff = Date.now() - DB.settings.retentionDays * DAY;
  const old = Bin.items().filter(i => new Date(i.deletedAt).getTime() < cutoff);
  let n = 0;
  for (const it of old) { try { Bin.purge(it.type, it.id, null); n++; } catch (e) { /* kept: still referenced */ } }
  if (n) { audit('bin.autopurge', `Removed ${plural(n, 'item')} older than ${DB.settings.retentionDays} days from the recycle bin`, null); save(); }
}

/* ---------- Exports ---------- */
function csvCell(v) {
  let s = v == null ? '' : Array.isArray(v) ? v.join('; ') : String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
const toCSV = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');
function cycleCSV(c) {
  mustRole('admin');
  const pq = formById(c.peerFormId)?.questions || [], mq = formById(c.managerFormId)?.questions || [];
  const rows = [['Cycle', 'Employee', 'Department', 'Manager', 'Response type', 'Respondent', 'Status', 'Submitted at', ...pq.map(q => 'Peer: ' + q.label), ...mq.map(q => 'Manager: ' + q.label)]];
  for (const r of reviewsOf(c.id)) {
    const emp = userById(r.employeeId), mgr = userById(r.managerId), st = reviewStats(r);
    const base = [c.name, emp.name, emp.dept, mgr?.name || ''];
    for (const pid of st.peers) {
      const resp = responseFor(r.id, pid, 'peer'), done = isSubmitted(resp);
      rows.push([...base, 'Peer', userById(pid)?.name || 'Former employee', done ? 'Submitted' : resp ? 'Draft' : 'Not started', done ? resp.submittedAt : '', ...pq.map(q => done ? resp.answers[q.id] : ''), ...mq.map(() => '')]);
    }
    if (r.managerId) {
      const resp = st.mresp, done = isSubmitted(resp);
      rows.push([...base, 'Manager', mgr?.name || '', done ? 'Submitted' : resp ? 'Draft' : 'Not started', done ? resp.submittedAt : '', ...pq.map(() => ''), ...mq.map(q => done ? resp.answers[q.id] : '')]);
    }
  }
  return toCSV(rows);
}
function auditCSV(entries) {
  return toCSV([['Time', 'Person', 'Action', 'Detail'], ...entries.map(a => [a.at, userById(a.actorId)?.name || (a.actorId ? 'Former employee' : 'System'), AUDIT_LABEL[a.action] || a.action, a.detail])]);
}

/* ---------- Toasts ---------- */
function toast(msg, tone = 'ok') {
  const root = $('#toasts');

/* ---------- Saving files ---------- */
async function offerFile(filename, data) {
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename, data }); toast(`${filename} saved`); return true; }
    catch (e) {
      if (e && e.code === 'declined') { toast('Download cancelled', 'warn'); return false; }
      if (e && e.code === 'rate_limited') { toast('A save prompt is already open. Finish that one first.', 'warn'); return false; }
    }
  }
  Modal.open({
    title: `Copy ${filename}`, wide: true,
    body: `<p class="muted">Saving files isn’t available in this view. Copy the contents below and save them in a file named <code>${esc(filename)}</code>.</p><textarea id="export-text" class="input mono" rows="12" readonly>${esc(data)}</textarea>`,
    actions: [{ label: 'Close' }, { label: 'Copy to clipboard', kind: 'primary', run: async () => { await copyText(data, $('#export-text')); return false; } }]
  });
  return false;
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast('Copied'); }
  catch (e) { if (fallbackEl) { fallbackEl.focus(); fallbackEl.select?.(); } toast('Press Ctrl+C or ⌘C to copy the selected text', 'warn'); }
}

function render() {
  const app = $('#app');
  if (Session.data && Session.expired()) { signOut('timeout'); return; }
  const me = ME();
  if (!me) {
    if (Session.data) Session.end();
    app.innerHTML = viewLogin();
    return;
  }
  if (me.mustChange) UI.route = { name: 'account', forced: true };
  const cfg = ROUTES[me.role];
  if (!cfg.allowed.includes(UI.route.name)) UI.route = { name: cfg.home };
  let page;
  try {
    page = VIEWS[UI.route.name](UI.route, me);
  } catch (e) {
    if (e instanceof AccessError) {
      audit('access.denied', `${me.name} was refused access: ${e.message}`, me.id); save();
      page = { title: 'No access', body: emptyState('This page isn’t available to you', esc(e.message), `<button type="button" class="btn" data-act="nav" data-to="${cfg.home}">Go to my home page</button>`) };
    } else {
      console.error(e);
      page = { title: 'Something went wrong', body: notice(esc(e.message || String(e)), 'bad') };
    }
  }
  app.innerHTML = shell(me, page);
  page.mount?.();
}

  UI = freshUI();
  if (reason === 'timeout') UI.flash = { tone: 'warn', text: `You were signed out after ${DB.settings.sessionMinutes} minutes of inactivity. Sign in again to continue.` };
  if (reason === 'restored') UI.flash = { tone: 'warn', text: 'Data was restored from a backup that doesn’t include your account. Sign in with an account from that backup.' };
  render();
}

async function doLogin(emailIn, pwIn) {
  const email = (emailIn ?? $('#login-email')?.value ?? '').trim().toLowerCase();
  const pw = pwIn ?? $('#login-pw')?.value ?? '';
  const errEl = $('#login-error'), btn = $('#login-submit');
  const fail = msg => { if (errEl) { errEl.textContent = msg; errEl.hidden = false; } return false; };
  if (!email || !pw) return fail('Enter your work email and password.');
  if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }
  try {
    await Boot.ready;
    const s = DB.settings;
    const u = DB.users.find(x => !x.deletedAt && x.email.toLowerCase() === email);
    if (!u) {
      await hashPassword(pw, randomHex(8));
      audit('auth.failed', `Failed sign-in for ${email}`, null); save();
      return fail('Email or password is incorrect.');
    }
    if (u.lockedUntil && new Date(u.lockedUntil) > new Date()) return fail(`This account is locked until ${fmtTime(u.lockedUntil)} after too many failed attempts. An HR admin can unlock it sooner.`);
    if (!u.active) return fail('This account is deactivated. Contact HR if you need access.');
    if (!(await verifyPassword(pw, u))) {
      u.failed = (u.failed || 0) + 1;
      if (u.failed >= s.maxAttempts) {
        u.lockedUntil = new Date(Date.now() + s.lockMinutes * 60000).toISOString(); u.failed = 0;
        audit('auth.locked', `${u.name}’s account was locked after ${s.maxAttempts} failed attempts`, u.id); save();
        return fail(`Too many failed attempts. This account is locked for ${s.lockMinutes} minutes.`);
      }
      audit('auth.failed', `Failed sign-in for ${u.email}`, u.id); save();
      return fail(`Email or password is incorrect. ${plural(s.maxAttempts - u.failed, 'attempt')} left before the account locks.`);
    }
    u.failed = 0; u.lockedUntil = null; u.lastLogin = nowISO();
    Session.start(u.id);
    audit('auth.login', `${u.name} signed in`, u.id);
    UI = freshUI();
    UI.route = { name: ROUTES[u.role].home };
    if (u.role === 'admin') { autoPurge(); await maybeAutoBackup(); }
    save();
    render();
    window.scrollTo(0, 0);
    return true;
  } finally {
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = 'Sign in'; }
  }
}

/* ---------- Event wiring ---------- */
const ACT = {}, CHANGE = {}, INPUT = {};
function handleError(err) {
  if (err instanceof UserError || err instanceof AccessError) toast(err.message, 'bad');
  else { console.error(err); toast(`Something went wrong: ${err?.message || err}`, 'bad'); }
}
document.addEventListener('click', async e => {
  const m = e.target.closest('[data-modal-act]');
  if (m) {
    const a = Modal.actions[Number(m.dataset.modalAct)];
    if (!a || !a.run) { Modal.close(); return; }
    const gen = Modal.gen;
    m.disabled = true;
    try {
      const res = await a.run();
      if (res !== false && Modal.gen === gen) Modal.close();
    } catch (err) {
      if (err instanceof UserError || err instanceof AccessError) Modal.error(err.message);
      else { console.error(err); Modal.error(`Something went wrong: ${err?.message || err}`); }
    } finally { if (document.body.contains(m)) m.disabled = false; }
    return;
  }
  if (e.target.matches('[data-modal-back]')) { Modal.close(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  try { await fn(el, e); } catch (err) { handleError(err); }
});
document.addEventListener('change', async e => {
  const el = e.target.closest('[data-change]');
  if (el && CHANGE[el.dataset.change]) { try { await CHANGE[el.dataset.change](el, e); } catch (err) { handleError(err); } }
  bindAnswer(e);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]');
  if (el && INPUT[el.dataset.input]) { try { INPUT[el.dataset.input](el, e); } catch (err) { handleError(err); } }
  bindAnswer(e);
  bindBuilder(e);
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const id = e.target.id;
  try {
    if (id === 'login-form') await doLogin();
    else if (FORMS[id]) await FORMS[id](e.target);
  } catch (err) { handleError(err); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Modal.isOpen()) Modal.close(); });

let lastTouch = 0;
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => {
  if (Date.now() - lastTouch > 5000) { lastTouch = Date.now(); Session.touch(); }
}, { passive: true, capture: true }));

setInterval(idleCheck, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) idleCheck(); });

ACT.nav = el => go(el.dataset.to, el.dataset.id ? { id: el.dataset.id } : {});

const FORMS = {};

/* =====================================================================
   Questionnaires: rendering, answering, read-only display
   Views for peers (Feedback requests) and managers (My team)
   ===================================================================== */
const VIEWS = {};

function ensureAnswers(key, initial) {
  if (!UI.answers || UI.answers.key !== key) UI.answers = { key, values: clone(initial || {}), errors: {} };
  return UI.answers;
}

function renderQuestion(q, i, val, { readonly = false, error = '', prefix = 'f' } = {}) {
  const id = `${prefix}-${q.id}`, dis = readonly ? 'disabled' : '';
  let control = '';
  if (q.type === 'rating') {
    control = `<div class="scale" role="radiogroup" aria-labelledby="${id}-l">${[1, 2, 3, 4, 5].map(n => `<label class="scale-opt"><input type="radio" name="${id}" value="${n}" data-ans="${esc(q.id)}" data-kind="rating" ${Number(val) === n ? 'checked' : ''} ${dis} aria-label="${n} out of 5"><span>${n}</span></label>`).join('')}</div>
      <div class="scale-ends"><span>1 · ${esc(q.low || 'Needs improvement')}</span><span>5 · ${esc(q.high || 'Outstanding')}</span></div>`;
  } else if (q.type === 'choice') {
    control = `<div class="opts" role="radiogroup" aria-labelledby="${id}-l">${(q.options || []).map(o => `<label class="opt"><input type="radio" name="${id}" value="${esc(o)}" data-ans="${esc(q.id)}" data-kind="choice" ${val === o ? 'checked' : ''} ${dis}><span>${esc(o)}</span></label>`).join('')}</div>`;
  } else if (q.type === 'checkbox') {
    const arr = Array.isArray(val) ? val : [];
    control = `<div class="opts" role="group" aria-labelledby="${id}-l">${(q.options || []).map(o => `<label class="opt"><input type="checkbox" value="${esc(o)}" data-ans="${esc(q.id)}" data-kind="checkbox" ${arr.includes(o) ? 'checked' : ''} ${dis}><span>${esc(o)}</span></label>`).join('')}</div>`;
  } else if (q.type === 'short') {
    control = `<input id="${id}" class="input" type="text" maxlength="200" value="${esc(val || '')}" data-ans="${esc(q.id)}" data-kind="text" ${dis} aria-labelledby="${id}-l">`;
  } else {
    control = `<textarea id="${id}" class="input" rows="4" maxlength="3000" data-ans="${esc(q.id)}" data-kind="text" ${dis} aria-labelledby="${id}-l">${esc(val || '')}</textarea>`;
  }
  return `<div class="q ${error ? 'has-error' : ''}" id="${id}-wrap">
    <div class="q-head"><span class="q-num">${pad(i + 1)}</span><div><div class="q-label" id="${id}-l">${esc(q.label)}${q.required ? '<span class="req" title="Required">*</span>' : ''}</div>${q.help ? `<div class="help">${esc(q.help)}</div>` : ''}</div></div>
    ${control}${error ? `<div class="field-error">${esc(error)}</div>` : ''}
  </div>`;
}
const renderForm = (form, A, opts = {}) => `<div class="qlist">${form.questions.map((q, i) => renderQuestion(q, i, A.values[q.id], { ...opts, error: A.errors?.[q.id] })).join('')}</div>`;

function bindAnswer(e) {
  const el = e.target.closest?.('[data-ans]');
  if (!el || !UI.answers || el.disabled) return;
  const qid = el.dataset.ans, kind = el.dataset.kind, V = UI.answers.values;
  if (kind === 'rating') V[qid] = Number(el.value);
  else if (kind === 'checkbox') V[qid] = $$('input[data-kind="checkbox"]').filter(b => b.dataset.ans === qid && b.checked).map(b => b.value);
  else V[qid] = el.value;
  UI.dirty = true;
  const wrap = el.closest('.q');
  if (wrap?.classList.contains('has-error')) { wrap.classList.remove('has-error'); wrap.querySelector('.field-error')?.remove(); delete UI.answers.errors[qid]; }
  const s = $('#save-status');
  if (s) s.textContent = 'Unsaved changes';
}

/* ---------- Read-only answers ---------- */
function answerValue(q, v) {
  const empty = v == null || v === '' || (Array.isArray(v) && !v.length);
  if (empty) return '<span class="ans-empty">No answer</span>';
  if (q.type === 'rating') return `<span>${pips(v)} <b class="num">${esc(v)}</b><span class="muted">/5</span></span>`;
  if (q.type === 'checkbox') return `<div class="chips">${v.map(x => `<span class="chip locked">${esc(x)}</span>`).join('')}</div>`;
  if (q.type === 'choice' || q.type === 'short') return `<div>${esc(v)}</div>`;
  return `<p class="ans-text">${esc(v)}</p>`;
}
function answerBlock(form, answers) {
  const ratings = form.questions.filter(q => q.type === 'rating');
  const rest = form.questions.filter(q => q.type !== 'rating');
  return `<div class="answers">
    ${ratings.length ? `<div class="ratings-row">${ratings.map(q => `<div class="rating-item"><span class="ans-q">${esc(q.label)}</span>${answerValue(q, answers[q.id])}</div>`).join('')}</div>` : ''}
    ${rest.map(q => `<div class="ans"><div class="ans-q">${esc(q.label)}</div>${answerValue(q, answers[q.id])}</div>`).join('')}
  </div>`;
}
function ratingAverages(form, sets) {
  return form.questions.filter(q => q.type === 'rating').map(q => {
    const vals = sets.map(a => Number(a[q.id])).filter(v => v >= 1 && v <= 5);
    const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    return { q, vals, avg, min: vals.length ? Math.min(...vals) : null, max: vals.length ? Math.max(...vals) : null };
  });
}
function overallAverage(form, sets) {
  const all = [];
  form.questions.filter(q => q.type === 'rating').forEach(q => sets.forEach(a => { const v = Number(a[q.id]); if (v >= 1 && v <= 5) all.push(v); }));
  return all.length ? all.reduce((a, b) => a + b, 0) / all.length : null;
}
function ratingSummary(form, sets) {
  const rows = ratingAverages(form, sets);
  const choices = form.questions.filter(q => q.type === 'choice' || q.type === 'checkbox');
  return `<div class="table-wrap"><table class="t avg-table">
    <thead><tr><th>Question</th><th>Average of ${plural(sets.length, 'response')}</th><th>Range</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${esc(r.q.label)}</td><td>${r.avg == null ? '<span class="muted">—</span>' : `<div class="avg">${bar(r.avg, 5, 'mark')}<b>${r.avg.toFixed(1)}</b></div>`}</td><td class="num muted nowrap">${r.min == null ? '—' : r.min === r.max ? r.min : `${r.min}–${r.max}`}</td></tr>`).join('')}
    ${choices.map(q => {
      const counts = {};
      sets.forEach(a => { const v = a[q.id]; (Array.isArray(v) ? v : v ? [v] : []).forEach(x => { counts[x] = (counts[x] || 0) + 1; }); });
      const txt = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${esc(k)} <b class="num">${n}</b>`).join(' · ');
      return `<tr><td>${esc(q.label)}</td><td colspan="2" class="muted">${txt || '—'}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

  const items = Q.myTeam();
  if (!items.length) return { title: 'My team', eyebrow: 'Manager', body: emptyState('No reviews for your team yet', 'When HR opens a review cycle that includes your direct reports, they appear here.') };
  const cycles = [...new Map(items.map(t => [t.cycle.id, t.cycle])).values()].sort((a, b) => (a.status === 'active' ? 0 : 1) - (b.status === 'active' ? 0 : 1) || (b.createdAt || '').localeCompare(a.createdAt || ''));
  const blocks = cycles.map(c => {
    const rows = items.filter(t => t.cycle.id === c.id).sort((a, b) => a.employee.name.localeCompare(b.employee.name));
    const pt = rows.reduce((a, t) => a + t.st.peerTotal, 0), pd = rows.reduce((a, t) => a + t.st.peerDone, 0);
    const ready = rows.filter(t => t.st.stage === 'manager').length, sent = rows.filter(t => t.st.mgrDone).length;
    const open = c.status === 'active';
    return `<section class="section">
      <div class="section-head"><h2>${esc(c.name)}</h2><p>${open ? `Assessments due ${dueChip(c.managerDeadline)}` : 'Closed. Read only.'}</p></div>
      <div class="facts">
        <div class="fact"><span class="fact-label">Direct reports</span><span class="fact-value">${rows.length}</span></div>
        <div class="fact"><span class="fact-label">Peer feedback received</span><span class="fact-value">${pd}<span class="kpi-of"> / ${pt}</span></span>${bar(pd, pt)}</div>
        <div class="fact"><span class="fact-label">Ready for you</span><span class="fact-value">${ready}</span></div>
        <div class="fact"><span class="fact-label">Assessments submitted</span><span class="fact-value">${sent}<span class="kpi-of"> / ${rows.length}</span></span>${bar(sent, rows.length, 'ok')}</div>
      </div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Employee</th><th>Peer feedback</th><th>Stage</th><th>Your assessment</th><th><span class="sr-only">Action</span></th></tr></thead>
        <tbody>${rows.map(t => {
          const label = t.st.mgrDone || !open ? 'View' : t.st.mgrDraft ? 'Continue assessment' : t.st.stage === 'manager' ? 'Write assessment' : 'Open';
          const primary = open && !t.st.mgrDone && t.st.stage === 'manager';
          return `<tr><td>${personCell(t.employee, t.employee.title)}</td>
            <td><div class="progress-cell">${bar(t.st.peerDone, t.st.peerTotal)}<span class="num">${t.st.peerDone} of ${t.st.peerTotal} received</span></div></td>
            <td>${teamRowStatus(t)}</td><td>${mgrStatus(t.st, t.review)}</td>
            <td class="actions"><button type="button" class="btn btn-sm ${primary ? 'btn-primary' : ''}" data-act="nav" data-to="mreview" data-id="${t.review.id}">${label}</button></td></tr>`;
        }).join('')}</tbody></table></div>
    </section>`;
  }).join('');
  return { title: 'My team', eyebrow: 'Manager', sub: 'Peer feedback for your direct reports, and your own assessments. You only see people who report to you.', body: `<div class="stack">${blocks}</div>` };
};

VIEWS.mreview = ({ id }, me) => {
  const p = Q.managerReview(id);
  const submitted = isSubmitted(p.response), open = p.cycle.status === 'active';
  const readonly = submitted || !open;
  const A = ensureAnswers(`${id}:manager`, p.response?.answers);
  const sets = p.peers.map(x => x.answers);
  const avg = p.peerForm ? overallAverage(p.peerForm, sets) : null;
  const waiting = p.peerTotal - p.peerDone;
  const peerSection = `<section class="section">
    <div class="section-head"><h2>Peer feedback</h2><p>${p.peerDone} of ${p.peerTotal} peers have responded</p></div>
    ${p.anon ? notice('Peer names are hidden so colleagues can be candid. Responses are labelled Peer A, Peer B and so on.', '', 'lock') : ''}
    ${waiting > 0 && open ? notice(`${plural(waiting, 'peer response')} still to come. You’ll get a notification as each one arrives.`, 'warn') : ''}
    ${!p.peers.length ? emptyState('No peer feedback yet', 'Peer responses appear here as soon as they’re submitted.') : `
      ${p.peerForm ? ratingSummary(p.peerForm, sets) : ''}
      <div class="resp-list">${p.peers.map(x => `<article class="panel resp"><div class="resp-head"><span class="resp-title">${esc(x.label)}</span>${x.submittedAt ? `<span class="muted">${esc(fmtDate(x.submittedAt))}</span>` : ''}</div>${answerBlock(p.peerForm, x.answers)}</article>`).join('')}</div>`}
  </section>`;
  let status = '';
  if (submitted) status = notice(`You submitted this assessment on ${esc(fmtDateTime(p.response.submittedAt))}. It can no longer be changed.`, 'ok', 'check');
  else if (!open) status = notice('This review cycle is closed, so the assessment can no longer be submitted.', 'warn');
  else if (waiting > 0) status = notice('You can start now and save a draft. Most managers wait until all peer feedback is in before submitting.', '');
  const assessSection = `<section class="section" style="max-width:860px">
    <div class="section-head"><h2>Your assessment</h2><p>${esc(p.managerForm?.name || '')}</p></div>
    ${status}${privacyNote('manager')}
    ${p.managerForm ? renderForm(p.managerForm, A, { readonly, prefix: 'mf' }) : notice('The manager questionnaire for this cycle is missing. Ask HR to check the cycle settings.', 'bad')}
    ${readonly || !p.managerForm ? '' : actionBar(id, 'manager', p.response)}
  </section>`;
  return {
    title: p.employee.name, eyebrow: p.cycle.name, back: { to: 'team', label: 'My team' },
    sub: `${esc(p.employee.title)} · ${esc(p.employee.dept)}`,
    body: `<div class="stack">
      <div class="facts">
        <div class="fact"><span class="fact-label">Peer feedback</span><span class="fact-value">${p.peerDone}<span class="kpi-of"> / ${p.peerTotal}</span></span></div>
        <div class="fact"><span class="fact-label">Peer average</span><span class="fact-value">${avg == null ? '—' : avg.toFixed(1)}<span class="kpi-of"> / 5</span></span></div>
        <div class="fact"><span class="fact-label">Assessment due</span><span class="fact-value sm">${dueChip(p.cycle.managerDeadline, open)}</span></div>
        <div class="fact"><span class="fact-label">Your assessment</span><span class="fact-value sm">${submitted ? pill('Submitted', 'ok') : p.response ? pill('Draft saved', 'mark') : pill('Not started')}</span></div>
      </div>
      ${peerSection}${assessSection}
    </div>`
  };
};

/* =====================================================================
   HR admin: dashboard, cycles, questionnaires, people, results
   ===================================================================== */
const adminCycles = () => DB.cycles.filter(c => !c.deletedAt).sort((a, b) => (a.status === 'active' ? 0 : 1) - (b.status === 'active' ? 0 : 1) || (b.createdAt || '').localeCompare(a.createdAt || ''));
function currentCycle() {
  const cs = adminCycles();
  let c = cs.find(x => x.id === UI.cycleId) || cs.find(x => x.status === 'active') || cs[0] || null;
  UI.cycleId = c?.id || null;
  return c;
}
const STATUS_PILL = { draft: ['Draft', ''], active: ['Open', 'accent'], closed: ['Closed', 'plain'] };
const cycleStatusPill = c => pill(...STATUS_PILL[c.status]);
function cyclePicker(c) {
  return `<label class="sr-only" for="cycle-pick">Review cycle</label><select id="cycle-pick" class="input input-inline" data-change="pick-cycle">${adminCycles().map(x => `<option value="${x.id}" ${x.id === c.id ? 'selected' : ''}>${esc(x.name)}${x.status === 'active' ? '' : ` (${STATUS_PILL[x.status][0].toLowerCase()})`}</option>`).join('')}</select>`;
}
CHANGE['pick-cycle'] = el => { UI.cycleId = el.value; UI.filters = { q: '', stage: '', dept: '' }; render(); };
function cycleDeadlines(c) {
  if (c.status === 'closed') return `Closed ${esc(fmtDate(c.closedAt))}`;
  return `Peer feedback due ${dueChip(c.peerDeadline, c.status === 'active')} <span class="faint">/</span> Manager assessments due ${dueChip(c.managerDeadline, c.status === 'active')}`;
}

/* ---------- Employee status table (dashboard + results) ---------- */
function employeeRows(c, s) {
  const f = UI.filters, q = f.q.trim().toLowerCase();
  return s.reviews.filter(r => {
    const emp = userById(r.employeeId), st = s.stats.get(r.id);
    if (q && !`${emp.name} ${emp.title} ${nameOf(r.managerId)}`.toLowerCase().includes(q)) return false;
    if (f.stage && st.stage !== f.stage) return false;
    if (f.dept && emp.dept !== f.dept) return false;
    return true;
  }).sort((a, b) => nameOf(a.employeeId).localeCompare(nameOf(b.employeeId)));
}
function employeeTableBody(c, s) {
  const rows = employeeRows(c, s);
  if (!rows.length) return `<tr><td colspan="6" class="muted" style="text-align:center; padding:28px">No employees match these filters.</td></tr>`;
  const peerOver = c.status === 'active' && daysLeft(c.peerDeadline) < 0, mgrOver = c.status === 'active' && daysLeft(c.managerDeadline) < 0;
  return rows.map(r => {
    const emp = userById(r.employeeId), st = s.stats.get(r.id);
    const late = (peerOver && st.peerDone < st.peerTotal) || (mgrOver && !st.mgrDone);
    return `<tr>
      <td>${personCell(emp)}</td>
      <td>${r.managerId ? esc(nameOf(r.managerId)) : '<span class="t-bad">Not assigned</span>'}</td>
      <td><div class="progress-cell">${bar(st.peerDone, st.peerTotal)}<span class="num">${st.peerDone} of ${st.peerTotal}${st.peerTotal < 2 ? ' · <span class="t-warn">few peers</span>' : ''}</span></div></td>
      <td>${mgrStatus(st, r)}</td>
      <td><div class="row">${stagePill(st)}${late ? pill('Overdue', 'bad') : ''}</div></td>
      <td class="actions"><button type="button" class="btn btn-sm" data-act="nav" data-to="packet" data-id="${r.id}">Open packet</button></td>
    </tr>`;
  }).join('');
}
function employeeTable(c, s) {
  const f = UI.filters;
  return `<div class="toolbar">
      <label class="sr-only" for="emp-q">Search employees</label><input id="emp-q" class="input search" type="search" placeholder="Search name, title or manager" value="${esc(f.q)}" data-input="emp-filter">
      <label class="sr-only" for="emp-stage">Stage</label><select id="emp-stage" class="input" data-change="emp-filter-stage"><option value="">All stages</option>${options(Object.entries(STAGE).map(([k, v]) => [k, v.label]), f.stage)}</select>
      <label class="sr-only" for="emp-dept">Department</label><select id="emp-dept" class="input" data-change="emp-filter-dept"><option value="">All departments</option>${options(Object.keys(s.byDept).sort().map(d => [d, d]), f.dept)}</select>
    </div>
    <div class="table-wrap"><table class="t"><thead><tr><th>Employee</th><th>Manager</th><th>Peer feedback</th><th>Manager assessment</th><th>Stage</th><th><span class="sr-only">Actions</span></th></tr></thead>
    <tbody id="emp-tbody">${employeeTableBody(c, s)}</tbody></table></div>`;
}
function refreshEmployeeTable() { const c = currentCycle(); const tb = $('#emp-tbody'); if (c && tb) tb.innerHTML = employeeTableBody(c, cycleStats(c)); }
INPUT['emp-filter'] = el => { UI.filters.q = el.value; refreshEmployeeTable(); };
CHANGE['emp-filter-stage'] = el => { UI.filters.stage = el.value; refreshEmployeeTable(); };

/* ---------- Dashboard ---------- */
VIEWS.dashboard = () => {
  mustRole('admin');
  const c = currentCycle();
  if (!c) return { title: 'Dashboard', body: emptyState('No review cycles yet', 'Create a review cycle, add employees and choose their reviewers to start collecting feedback.', '<button type="button" class="btn btn-primary" data-act="new-cycle">New review cycle</button>') };
  const s = cycleStats(c);
  const totalForms = s.peerTotal + s.mgrTotal, doneForms = s.peerDone + s.mgrDone;
  const open = c.status === 'active';
  const pending = [...s.pending.values()].filter(p => isLiveUser(p.user)).sort((a, b) => (b.peer.length + b.manager.length) - (a.peer.length + a.manager.length) || a.user.name.localeCompare(b.user.name));
  const seg = (n, tone) => n ? `<i class="${tone}" style="width:${(n / s.employees * 100).toFixed(1)}%"></i>` : '';
  const kpis = `<section class="kpis" aria-label="Cycle summary">
    <div class="kpi"><span class="kpi-label">Overall completion</span><span class="kpi-value">${pct(doneForms, totalForms)}%</span>${bar(doneForms, totalForms)}<span class="kpi-foot">${doneForms} of ${totalForms} forms submitted</span></div>
    <div class="kpi"><span class="kpi-label">Peer feedback</span><span class="kpi-value">${s.peerDone}<span class="kpi-of"> / ${s.peerTotal}</span></span>${bar(s.peerDone, s.peerTotal, 'info')}<span class="kpi-foot">${s.peerTotal - s.peerDone} pending${s.peerOverdue ? ` · <span class="t-bad">${s.peerOverdue} overdue</span>` : ''}</span></div>
    <div class="kpi"><span class="kpi-label">Manager assessments</span><span class="kpi-value">${s.mgrDone}<span class="kpi-of"> / ${s.mgrTotal}</span></span>${bar(s.mgrDone, s.mgrTotal, 'mark')}<span class="kpi-foot">${s.mgrTotal - s.mgrDone} pending · ${s.stages.manager} ready to write${s.mgrOverdue ? ` · <span class="t-bad">${s.mgrOverdue} overdue</span>` : ''}</span></div>
    <div class="kpi"><span class="kpi-label">Employees complete</span><span class="kpi-value">${s.stages.complete}<span class="kpi-of"> / ${s.employees}</span></span>${bar(s.stages.complete, s.employees, 'ok')}<span class="kpi-foot">Peer and manager forms all in</span></div>
  </section>`;
  const stages = `<div class="panel"><h3>Where reviews stand</h3>
    <div class="bar thick" role="img" aria-label="${s.stages.peers} collecting peer feedback, ${s.stages.manager} with manager, ${s.stages.complete} complete">${seg(s.stages.peers, 'info')}${seg(s.stages.manager, 'mark')}${seg(s.stages.complete, 'ok')}</div>
    <div class="legend">
      <div class="legend-row"><span class="sw info"></span><span>Collecting peer feedback</span><b>${s.stages.peers}</b></div>
      <div class="legend-row"><span class="sw mark"></span><span>With manager (all peers in)</span><b>${s.stages.manager}</b></div>
      <div class="legend-row"><span class="sw ok"></span><span>Complete</span><b>${s.stages.complete}</b></div>
    </div>
    ${s.noManager ? `<div style="margin-top:14px">${notice(`${plural(s.noManager, 'employee')} ${s.noManager === 1 ? 'has' : 'have'} no manager assigned.`, 'bad')}</div>` : ''}
  </div>`;
  const depts = Object.entries(s.byDept).sort((a, b) => a[0].localeCompare(b[0]));
  const deptPanel = `<div class="panel"><h3>By department</h3><div style="overflow-x:auto"><table class="t dept-table">
    <thead><tr><th>Department</th><th>Peer feedback</th><th>Manager</th><th>Complete</th></tr></thead>
    <tbody>${depts.map(([d, v]) => `<tr><td><b>${esc(d)}</b> <span class="muted">· ${v.employees}</span></td><td><div class="progress-cell">${bar(v.peerDone, v.peerTotal, 'info')}<span class="num">${v.peerDone}/${v.peerTotal}</span></div></td><td class="num">${v.mgrDone}/${v.mgrTotal}</td><td class="num">${v.complete}/${v.employees}</td></tr>`).join('')}</tbody>
  </table></div></div>`;
  const pendingSection = `<section class="section">
    <div class="section-head"><div><h2>Waiting on responses</h2><p>${pending.length ? `${plural(pending.length, 'person', 'people')} still have forms to submit` : 'Everyone has responded'}</p></div>
      ${open && pending.length ? `<button type="button" class="btn" data-act="remind-all" data-cycle="${c.id}">${ic('bell', 16)}Remind everyone (${pending.length})</button>` : ''}</div>
    ${pending.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>Person</th><th>Outstanding</th><th>Feedback still needed for</th><th>Earliest due</th><th>Last reminder</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>
      ${pending.map(p => {
        const forWhom = [...p.peer.map(r => nameOf(r.employeeId)), ...p.manager.map(r => `${nameOf(r.employeeId)} (manager)`)];
        const due = p.peer.length ? c.peerDeadline : c.managerDeadline;
        const parts = [p.peer.length ? plural(p.peer.length, 'peer form') : '', p.manager.length ? plural(p.manager.length, 'assessment') : ''].filter(Boolean).join(' · ');
        const last = c.reminders?.[p.user.id];
        return `<tr><td>${personCell(p.user, `${ROLE_LABEL[p.user.role]} · ${p.user.dept}`)}</td><td class="nowrap">${parts}</td><td style="min-width:200px">${esc(forWhom.slice(0, 3).join(', '))}${forWhom.length > 3 ? ` <span class="muted">+${forWhom.length - 3} more</span>` : ''}</td><td>${dueChip(due, open)}</td><td class="muted nowrap">${last ? esc(relTime(last)) : 'Never'}</td>
          <td class="actions">${open ? `<button type="button" class="btn btn-sm" data-act="remind-one" data-cycle="${c.id}" data-user="${p.user.id}">Remind</button>` : ''}</td></tr>`;
      }).join('')}</tbody></table></div>` : emptyState('Nothing pending', 'Every assigned peer and manager has submitted their form for this cycle.')}
  </section>`;
  const recent = DB.audit.slice(0, 8);
  const feed = `<section class="section"><div class="section-head"><h2>Recent activity</h2><button type="button" class="link" data-act="open-audit">Full audit log</button></div>
    <div class="panel" style="padding-block:6px"><div class="feed">${recent.map(a => `<div class="feed-item"><div><b>${esc(AUDIT_LABEL[a.action] || a.action)}</b> <span class="muted">· ${esc(a.detail)}</span></div><span class="feed-time" title="${esc(fmtDateTime(a.at))}">${esc(relTime(a.at))}</span></div>`).join('')}</div></div></section>`;
  return {
    title: 'Dashboard', eyebrow: 'HR Admin',
    sub: `${cycleStatusPill(c)} ${cycleDeadlines(c)}`,
    actions: cyclePicker(c),
    body: `<div class="stack">
      ${c.status === 'draft' ? notice(`This cycle is a draft, so nobody has been asked for feedback yet. <button type="button" class="link" data-act="nav" data-to="cycle" data-id="${c.id}">Finish setting it up</button>`, 'warn') : ''}
      ${kpis}<div class="grid-2">${stages}${deptPanel}</div>${pendingSection}
      <section class="section"><div class="section-head"><h2>Employees in this cycle</h2><p>${plural(s.employees, 'employee')}</p></div>${employeeTable(c, s)}</section>
      ${feed}
    </div>`
  };
};
ACT['open-audit'] = () => { UI.protectTab = 'audit'; go('protection'); };
ACT['remind-one'] = el => { const n = Data.remind(el.dataset.cycle, [el.dataset.user]); toast(n ? `Reminder sent to ${nameOf(el.dataset.user)}` : 'Nothing pending for this person', n ? 'ok' : 'warn'); render(); };

ACT['edit-cycle'] = el => {

ACT['cycle-status'] = el => {

    title: first ? `Open "${c.name}"?` : `Reopen "${c.name}"?`, confirm: first ? 'Open cycle' : 'Reopen cycle',

VIEWS.cycle = ({ id }) => {

    : `<button type="button" class="btn" data-act="cycle-status" data-id="${c.id}" data-status="active">Reopen cycle</button>`;
  const table = rows.length ? `<div class="table-wrap"><table class="t">
    <thead><tr><th>Employee</th><th>Manager</th><th>Peer reviewers</th><th>Progress</th><th><span class="sr-only">Remove</span></th></tr></thead>

      const chips = r.peerIds.map(pid => {

      return `<tr><td>${personCell(emp)}</td><td>${mgrSel}</td><td style="min-width:260px"><div class="chips">${chips}${add}</div>${st.peerTotal < 2 ? '<div class="help t-warn" style="margin-top:6px">Add at least two peers for balanced feedback.</div>' : ''}</td>
        <td><div class="row">${stagePill(st)}</div><div class="help num" style="margin-top:4px">${st.peerDone}/${st.peerTotal} peers · manager ${st.mgrDone ? 'done' : 'pending'}</div></td>

    body: `<div class="stack">
      ${c.status === 'draft' ? notice('This cycle is a draft. Peers and managers can’t see it until you open it.', 'warn') : ''}
      ${closed ? notice('This cycle is closed. Assignments and responses are read-only. Reopen it to make changes.', 'warn') : ''}
      <div class="facts">
        <div class="fact"><span class="fact-label">Peer questionnaire</span><span class="fact-value sm">${pf ? esc(pf.name) : '<span class="t-bad">Missing</span>'}</span><span class="help">${pf ? plural(pf.questions.length, 'question') : ''}</span></div>
        <div class="fact"><span class="fact-label">Manager questionnaire</span><span class="fact-value sm">${mf ? esc(mf.name) : '<span class="t-bad">Missing</span>'}</span><span class="help">${mf ? plural(mf.questions.length, 'question') : ''}</span></div>
        <div class="fact"><span class="fact-label">Employees</span><span class="fact-value">${s.employees}</span></div>
        <div class="fact"><span class="fact-label">Forms submitted</span><span class="fact-value">${s.peerDone + s.mgrDone}<span class="kpi-of"> / ${s.peerTotal + s.mgrTotal}</span></span></div>
